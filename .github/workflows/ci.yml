name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust, mod and scripts
    runs-on: ubuntu-latest # macOS runners queue for long; only the release needs macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Mod tests
        run: node --test test/*.test.js
      - name: Shellcheck
        run: shellcheck -s sh install.sh uninstall.sh scripts/*.sh
