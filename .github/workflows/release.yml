name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag
        run: |
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "unexpected tag: $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Create it from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "herdr-feed $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"

  build:
    name: ${{ matrix.target }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu # experimental
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu # experimental
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: |
          cargo test --locked
          node --test test/*.test.js
      - name: Package
        id: pack
        run: |
          file=$(scripts/package-release.sh "$GITHUB_REF_NAME" "${{ matrix.target }}")
          case "$file" in build/release/herdr-feed-v*-"${{ matrix.target }}".tar.gz) ;; *) echo "unexpected package path: $file" >&2; exit 1;; esac
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
