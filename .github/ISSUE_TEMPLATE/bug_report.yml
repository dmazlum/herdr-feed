name: Bug report
description: Something in the pane, the mod, fetching or video playback doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot of the pane helps a lot.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Linux (experimental)]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "macOS: sw_vers -productVersion · Linux: your distribution and desktop · then: herdr-app --version; ffmpeg -version | head -1; yt-dlp --version"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pane / cards, Video, Images, Mod / opening and closing, Pane width, Fetching / sources, Install, Linux report (works / doesn't)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The end of ~/.cache/herdr-feed/log.txt, and `herdr-app status` if the mod misbehaves.
      render: text
